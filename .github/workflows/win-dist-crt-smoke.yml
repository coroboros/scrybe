name: Windows dist CRT smoke

# TEMPORARY — remove before merge. Runs the real `dist build` on the Windows target
# that failed the 0.2.0 release, so it reads msvc-crt-static from workspace.metadata
# and links exactly as the release does — unlike a plain `cargo build`, which never
# applies cargo-dist's CRT flag and gave a false pass last time.
on:
  push:
    branches: [fix/windows-dist-crt-static-placement]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-dist:
    name: dist build · x86_64-pc-windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Install cargo-dist 0.32.0
        run: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 | iex
        shell: pwsh
      - name: dist build (Windows target)
        run: dist build --artifacts=local --target x86_64-pc-windows-msvc
        shell: pwsh
