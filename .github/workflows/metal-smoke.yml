name: Metal smoke

# Compile-only check for the Metal backend (the exit-13 GPU arm), which the default CPU
# pipeline never exercises. macos-latest ships the full Xcode + Metal toolchain, so the
# build validates without a GPU runner. cuda/vulkan need their SDKs and are built locally
# per the README. Supplements coroboros/ci's rust-packages pipeline, which builds the
# default (CPU) features only.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metal:
    name: build · metal (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: metal
      - name: Build (metal)
        run: cargo build --features metal
