name: ONNX substrate probe

# Substrate gate for ONNX Runtime: on PRs that touch the substrate, provisions the
# native runtime through the real ci/setup.sh (prebuilt static ORT for the three
# targets pyke can't serve, pyke's SHA-verified download for the rest), then builds
# the probe and runs one inference per dist target with a silent stderr. It exercises
# the exact provisioning the release dist build uses, so a future ort/ONNX Runtime
# bump or a broken archive is caught before release.
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "ci/setup.sh"
      - "examples/ort-probe.rs"
      - "src/diarize/**"
      - ".github/workflows/ort-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ort-probe-${{ matrix.target }}
      # CARGO_DIST_TARGET makes ci/setup.sh take the dist-build path: cmake + the
      # ONNX Runtime provisioning (prebuilt archive or from-source), ORT_LIB_PATH
      # exported for the three self-built targets, pyke's download for the rest.
      - name: Provision native deps (cmake + ONNX Runtime)
        shell: bash
        env:
          CARGO_DIST_TARGET: ${{ matrix.target }}
        run: bash ci/setup.sh
      - name: Build probe
        shell: bash
        run: cargo build --release --example ort-probe
      - name: Substrate tests
        shell: bash
        run: cargo test --release --test ort_substrate
      - name: Run probe (first run may download the model)
        shell: bash
        run: ./target/release/examples/ort-probe
      - name: Run probe again — stderr must stay silent
        shell: bash
        run: |
          ./target/release/examples/ort-probe 2>stderr.log
          if [ -s stderr.log ]; then
            echo "::error::stderr is not clean on a cache-hit run:"
            cat stderr.log
            exit 1
          fi
      - name: Probe binary size
        shell: bash
        run: ls -la target/release/examples/
