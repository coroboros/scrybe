name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cmake builds whisper.cpp (whisper-rs-sys); ffmpeg exercises the decoder
      # fallback tests deterministically.
      - name: Install cmake + ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake ffmpeg
          else
            brew install ffmpeg
          fi

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # The golden test runs on the CPU backend against a cached tiny model — no
      # GPU runner and no per-run network download.
      - name: Cache the tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Pre-fetch the tiny model
        run: cargo run --quiet -- models pull tiny

      # The model is pre-fetched above and ffmpeg is installed, so here their
      # absence is a hard failure, not a silent skip — a model/ffmpeg-gated test
      # can never report green while exercising nothing.
      - name: Test
        env:
          SCRYBE_REQUIRE_MODEL: "1"
          SCRYBE_REQUIRE_FFMPEG: "1"
        run: cargo test
