name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cmake builds whisper.cpp (whisper-rs-sys); ffmpeg exercises the decoder
      # fallback tests deterministically.
      - name: Install cmake + ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y cmake ffmpeg
          else
            brew install ffmpeg
          fi

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # The golden test runs on the CPU backend against a cached tiny model — no
      # GPU runner and no per-run network download.
      - name: Cache the tiny model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Pre-fetch the tiny model
        run: cargo run --quiet -- models pull tiny

      # The model is pre-fetched above and ffmpeg is installed, so here their
      # absence is a hard failure, not a silent skip — a model/ffmpeg-gated test
      # can never report green while exercising nothing.
      - name: Test
        env:
          SCRYBE_REQUIRE_MODEL: "1"
          SCRYBE_REQUIRE_FFMPEG: "1"
        run: cargo test

  # Compile-only smoke for the Metal backend (the exit-13 GPU arm), which the default
  # CPU CI never exercises. macos-latest ships the full Xcode + Metal toolchain, so the
  # build validates without a GPU runner. cuda/vulkan need their SDKs and are built
  # locally per the README.
  metal:
    name: build · metal (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: metal
      - name: Build (metal)
        run: cargo build --features metal

  # Supply-chain gate: advisories (vulnerable/yanked crates), license allow-list,
  # banned wildcards, and crate sources — configured in deny.toml.
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
