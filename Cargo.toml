[package]
name = "scrybe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Collapse sound into signal — a fast, offline Whisper transcription CLI."
authors = ["Coroboros <ob@coroboros.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/coroboros/scrybe"
homepage = "https://github.com/coroboros/scrybe#readme"
keywords = ["whisper", "transcription", "speech-to-text", "cli", "audio"]
categories = ["command-line-utilities", "multimedia::audio"]
# Published to crates.io as `scrybe`; the `@coroboros/scrybe` npm wrapper is added in distribution.

[[bin]]
name = "scrybe"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
audioadapter-buffers = "3.0.0"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
indicatif = "0.18.4"
rayon = "1.12.0"
rubato = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
symphonia = { version = "0.6.0", features = ["mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
sysinfo = "0.39.3"
whisper-rs = "0.16.0"

[features]
# CPU backend everywhere by default, so the crate builds with no GPU toolchain
# (and CI needs none). GPU backends are opt-in; release builds add `metal` for
# Apple Silicon, `cuda`/`vulkan` are build-from-source.
default = []
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

# Every user-facing failure routes through the error enum, never a panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
strip = true
lto = "thin"

# Cross-platform release automation. Run `dist init` / `dist generate`
# (cargo-dist 0.32) to emit `.github/workflows/release.yml` from this config;
# `release-plz` tags and creates the GitHub release that triggers it.
#
# Apple Silicon prebuilts should build with `--features metal`; Developer-ID
# signing + notarization require the Apple Developer account (see README) and
# are wired here only once that account exists.
[package.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "npm"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
tap = "coroboros/homebrew-tap"
npm-scope = "@coroboros"
publish-jobs = ["homebrew", "npm"]
install-path = "CARGO_HOME"
