# cargo-deny configuration — supply-chain gate run in CI.
# Allow-list is calibrated to the licenses actually present in the dependency tree
# (`cargo metadata`); advisories and crate sources are enforced strictly.

[advisories]
version = 2
# Fail on any unmaintained/vulnerable crate or a yanked release.
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Every license resolved from the tree's SPDX expressions. symphonia is MPL-2.0
# (file-level copyleft, used unmodified); the rest are permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
# Duplicate versions are common in a large tree and not a failure on their own.
multiple-versions = "warn"
# A wildcard version pin is a real hazard; scrybe pins explicitly.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
